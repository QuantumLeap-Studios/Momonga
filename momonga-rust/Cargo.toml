[package]
name = "momonga"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart", "default-tls"] }
serialport = { version = "4.10.1", default-features = false }
tauri-plugin-dialog = "2"

